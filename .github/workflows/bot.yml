name: Run Vinza Bot
on:
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm install
      - name: Run Server + Tunnel
        run: |
          node server.js &
          echo "Tunggu server nyala 5 detik..."
          sleep 5
          echo "Buka tunnel..."
          npx localtunnel --port 3000 --print-requests
